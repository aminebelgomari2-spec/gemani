<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mec GPT — Premium Mistral AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Personnalisation de la barre de défilement */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f293d;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff5e1a; /* Couleur typée Mistral */
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 font-sans h-screen flex flex-col justify-between overflow-hidden">

    <header class="border-b border-gray-800 bg-[#111827]/80 backdrop-blur-md px-6 py-4 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-orange-600 to-amber-500 p-2.5 rounded-xl shadow-lg shadow-orange-500/20">
                <i class="fa-solid fa-fire text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">Mec GPT</h1>
                <p class="text-xs text-orange-400 font-medium tracking-widest uppercase">Mistral Premium Edition</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
                <span class="h-2 w-2 rounded-full bg-amber-400 mr-2 animate-pulse"></span> Mistral connecté
            </span>
        </div>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto px-4 py-8 md:px-0 max-w-3xl mx-auto w-full space-y-6">
        
        <div id="welcome-screen" class="flex flex-col items-center justify-center text-center h-full py-12 space-y-6">
            <div class="w-20 h-20 bg-gradient-to-tr from-orange-500/10 to-amber-500/10 rounded-3xl border border-orange-500/30 flex items-center justify-center animate-bounce">
                <i class="fa-solid fa-wand-magic-sparkles text-3xl text-orange-400"></i>
            </div>
            <div class="space-y-2">
                <h2 class="text-3xl font-extrabold text-white">Qu'est-ce qu'on fait aujourd'hui, mec ?</h2>
                <p class="text-gray-400 text-sm max-w-md mx-auto">Pose tes questions à Mec GPT, propulsé par la puissance de l'IA Mistral.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full max-w-xl px-4 pt-4">
                <button onclick="quickPrompt('Explique-moi la théorie de la relativité simplement.')" class="p-4 bg-[#111827] hover:bg-[#1f293d] border border-gray-800 rounded-xl text-left transition text-sm">
                    <span class="block font-semibold text-gray-200">Expliquer un concept</span>
                    <span class="text-gray-400 text-xs">"La relativité simplement..."</span>
                </button>
                <button onclick="quickPrompt('Écris un mail professionnel pour demander une augmentation.')" class="p-4 bg-[#111827] hover:bg-[#1f293d] border border-gray-800 rounded-xl text-left transition text-sm">
                    <span class="block font-semibold text-gray-200">Rédiger un contenu</span>
                    <span class="text-gray-400 text-xs">"Un mail pour une augmentation..."</span>
                </button>
            </div>
        </div>

    </main>

    <footer class="border-t border-gray-800/60 bg-[#111827]/40 backdrop-blur-md p-4">
        <div class="max-w-3xl mx-auto relative">
            <form id="chat-form" class="flex items-center relative">
                <textarea 
                    id="user-input"
                    rows="1"
                    placeholder="Pose ta question à Mec GPT..."
                    class="w-full bg-[#111827] text-gray-100 placeholder-gray-500 rounded-2xl pl-5 pr-14 py-4 focus:outline-none focus:ring-2 focus:ring-orange-500 border border-gray-800 resize-none shadow-inner"
                    required
                ></textarea>
                <button 
                    type="submit" 
                    id="send-btn"
                    class="absolute right-3 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white p-2.5 rounded-xl transition duration-200 flex items-center justify-center shadow-md shadow-orange-500/20"
                >
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
            <p class="text-center text-[10px] text-gray-600 mt-2 tracking-wide">Mec GPT — Powered by Mistral AI. Relisez les informations importantes.</p>
        </div>
    </footer>

    <script>
        const API_KEY = "YEPLXud6h3gN42kkFvH6XTa1nvEOevzv"; 
        const chatContainer = document.getElementById('chat-container');
        const welcomeScreen = document.getElementById('welcome-screen');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Gérer le redimensionnement automatique de l'input texte
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        function quickPrompt(text) {
            userInput.value = text;
            chatForm.dispatchEvent(new Event('submit'));
        }

        // Ajouter un message à l'interface
        function appendMessage(role, text) {
            if (welcomeScreen) welcomeScreen.remove();

            const messageDiv = document.createElement('div');
            messageDiv.className = `flex space-x-4 p-5 rounded-2xl transition duration-300 ${
                role === 'user' 
                ? 'bg-[#1e293b]/40 border border-gray-800/40 ml-12' 
                : 'bg-[#111827]/80 border border-orange-950/20 mr-12'
            }`;

            const avatar = role === 'user' 
                ? `<div class="bg-gray-700 h-9 w-9 rounded-xl flex items-center justify-center flex-shrink-0 shadow-md">
                    <i class="fa-solid fa-user text-xs text-gray-300"></i>
                   </div>`
                : `<div class="bg-gradient-to-tr from-orange-600 to-amber-500 h-9 w-9 rounded-xl flex items-center justify-center flex-shrink-0 shadow-lg shadow-orange-500/10">
                    <i class="fa-solid fa-fire text-xs text-white"></i>
                   </div>`;

            messageDiv.innerHTML = `
                ${avatar}
                <div class="flex-1 space-y-1 overflow-hidden">
                    <p class="text-xs font-semibold tracking-wider uppercase ${role === 'user' ? 'text-gray-400' : 'text-orange-400'}">
                        ${role === 'user' ? 'Toi' : 'Mec GPT'}
                    </p>
                    <div class="text-sm leading-relaxed text-gray-200 whitespace-pre-wrap">${text}</div>
                </div>
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        // Indicateur de chargement
        function appendLoader() {
            const loaderDiv = document.createElement('div');
            loaderDiv.id = 'gpt-loader';
            loaderDiv.className = 'flex space-x-4 p-5 bg-[#111827]/80 rounded-2xl border border-orange-950/20 mr-12';
            loaderDiv.innerHTML = `
                <div class="bg-gradient-to-tr from-orange-600 to-amber-500 h-9 w-9 rounded-xl flex items-center justify-center flex-shrink-0 animate-pulse">
                    <i class="fa-solid fa-fire text-xs text-white"></i>
                </div>
                <div class="flex-1 flex flex-col justify-center space-y-2">
                    <p class="text-xs font-semibold tracking-wider uppercase text-orange-400">Mec GPT réfléchit</p>
                    <div class="flex space-x-1.5 pt-1">
                        <div class="w-2 h-2 bg-orange-500 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
                        <div class="w-2 h-2 bg-orange-400 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                        <div class="w-2 h-2 bg-amber-400 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(loaderDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Soumission du formulaire
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = userInput.value.trim();
            if (!messageText) return;

            appendMessage('user', messageText);
            userInput.value = '';
            userInput.style.height = 'auto';

            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50');
            appendLoader();

            try {
                // Route officielle de l'API de Mistral AI
                const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'mistral-large-latest', // Modèle Premium de Mistral
                        messages: [{ role: 'user', content: messageText }]
                    })
                });

                const data = await response.json();
                
                // Supprimer le loader
                document.getElementById('gpt-loader').remove();

                if (response.ok) {
                    const aiReply = data.choices[0].message.content;
                    appendMessage('assistant', aiReply);
                } else {
                    appendMessage('assistant', `⚠️ Erreur Mistral : ${data.message ? data.message : 'Erreur de configuration de la clé.'}`);
                }

            } catch (error) {
                console.error(error);
                document.getElementById('gpt-loader').remove();
                appendMessage('assistant', "❌ Erreur réseau. Vérifie ta connexion ou l'état des serveurs de Mistral.");
            } finally {
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-50');
            }
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
