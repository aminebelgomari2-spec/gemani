<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemani AI - Assistant Intelligent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; height: 100vh; background-color: #0d0f12; color: #e1e7ed; overflow: hidden; }

    /* Sidebar */
    #sidebar { width: 280px; background-color: #13171d; padding: 20px 15px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #212830; }
    #new-chat-btn { padding: 14px; background: linear-gradient(135deg, #6366f1, #3b82f6); color: #fff; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2); transition: opacity 0.2s; }
    #new-chat-btn:hover { opacity: 0.9; }
    #chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .chat-item { padding: 12px; background-color: transparent; border-radius: 8px; cursor: pointer; border: none; color: #9da7b3; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; transition: background 0.2s, color 0.2s; }
    .chat-item:hover, .chat-item.active { background-color: #1f2630; color: #f0f4f8; }

    .sidebar-footer { border-top: 1px solid #212830; pt: 15px; padding-top: 15px; display: flex; flex-direction: column; gap: 8px; }
    .btn-footer { padding: 10px; background: transparent; border: 1px solid #212830; color: #9da7b3; border-radius: 8px; cursor: pointer; font-size: 0.85rem; text-align: left; transition: background 0.2s; }
    .btn-footer:hover { background: #1f2630; color: #fff; }

    /* Main Chat */
    #main-chat { flex: 1; display: flex; flex-direction: column; height: 100vh; background-color: #0d0f12; }
    #header { padding: 18px 24px; border-bottom: 1px solid #212830; display: flex; justify-content: space-between; align-items: center; background: #13171d; }
    .header-title { font-size: 1.1rem; font-weight: 600; color: #f0f4f8; display: flex; align-items: center; gap: 10px; }
    .status-badge { font-size: 0.75rem; padding: 4px 8px; background: rgba(34, 197, 94, 0.1); color: #4ade80; border-radius: 20px; border: 1px solid rgba(34, 197, 94, 0.2); }

    #messages { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .message { max-width: 80%; padding: 14px 18px; border-radius: 14px; line-height: 1.6; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background-color: #2563eb; color: #ffffff; border-bottom-right-radius: 2px; }
    .model { align-self: flex-start; background-color: #13171d; border: 1px solid #212830; color: #e1e7ed; border-bottom-left-radius: 2px; }

    /* Input Area */
    #input-container { padding: 20px 24px; background: #13171d; border-top: 1px solid #212830; display: flex; gap: 12px; }
    #user-input { flex: 1; padding: 14px 18px; border-radius: 10px; border: 1px solid #212830; background-color: #0d0f12; color: #fff; outline: none; font-size: 0.95rem; transition: border-color 0.2s; }
    #user-input:focus { border-color: #3b82f6; }
    #send-btn { padding: 0 20px; background: #2563eb; border: none; border-radius: 10px; color: #fff; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    #send-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <div id="sidebar">
    <button id="new-chat-btn" onclick="startNewChat()">+ Nouvelle discussion</button>
    <div id="chat-list"></div>
    <div class="sidebar-footer">
      <button class="btn-footer" onclick="promptApiKey()">⚙️ Clé API Gemini</button>
    </div>
  </div>

  <div id="main-chat">
    <div id="header">
      <div class="header-title">
        Gemani AI
        <span class="status-badge">● Gemini 1.5 Flash Active</span>
      </div>
    </div>
    <div id="messages"></div>
    <div id="input-container">
      <input type="text" id="user-input" placeholder="Posez votre question à Gemani..." onkeypress="handleKeyPress(event)">
      <button id="send-btn" onclick="sendMessage()">Envoyer</button>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem('gemani_api_key') || '';
    let chats = JSON.parse(localStorage.getItem('gemani_chats')) || [];
    let currentChatId = null;

    function init() {
      if (!apiKey) {
        setTimeout(promptApiKey, 500);
      }
      renderChatList();
      if (chats.length > 0) {
        loadChat(chats[0].id);
      } else {
        startNewChat();
      }
    }

    function promptApiKey() {
      const key = prompt("Entrez votre clé API Google Gemini :", apiKey);
      if (key !== null) {
        apiKey = key.trim();
        localStorage.setItem('gemani_api_key', apiKey);
      }
    }

    function saveToStorage() {
      localStorage.setItem('gemani_chats', JSON.stringify(chats));
    }

    function startNewChat() {
      const newChat = {
        id: Date.now(),
        title: "Nouvelle discussion",
        history: []
      };
      chats.unshift(newChat);
      currentChatId = newChat.id;
      saveToStorage();
      renderChatList();
      renderMessages();
    }

    function renderChatList() {
      const chatListEl = document.getElementById('chat-list');
      chatListEl.innerHTML = '';
      chats.forEach(chat => {
        const btn = document.createElement('button');
        btn.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
        btn.innerText = chat.title;
        btn.onclick = () => loadChat(chat.id);
        chatListEl.appendChild(btn);
      });
    }

    function loadChat(id) {
      currentChatId = id;
      renderChatList();
      renderMessages();
    }

    function getCurrentChat() {
      return chats.find(c => c.id === currentChatId);
    }

    function renderMessages() {
      const messagesEl = document.getElementById('messages');
      messagesEl.innerHTML = '';
      const currentChat = getCurrentChat();

      if (!currentChat) return;

      currentChat.history.forEach(msg => {
        const div = document.createElement('div');
        div.className = `message ${msg.role === 'user' ? 'user' : 'model'}`;
        div.innerText = msg.parts[0].text;
        messagesEl.appendChild(div);
      });

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      if (!apiKey) {
        alert("Veuillez entrer une clé API valide.");
        promptApiKey();
        return;
      }

      const inputEl = document.getElementById('user-input');
      const text = inputEl.value.trim();
      if (!text) return;

      const currentChat = getCurrentChat();
      currentChat.history.push({ role: 'user', parts: [{ text }] });
      
      if (currentChat.history.length === 1) {
        currentChat.title = text.length > 22 ? text.substring(0, 22) + '...' : text;
        renderChatList();
      }

      inputEl.value = '';
      renderMessages();

      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: currentChat.history })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content) {
          const modelResponse = data.candidates[0].content.parts[0].text;
          currentChat.history.push({ role: 'model', parts: [{ text: modelResponse }] });
        } else if (data.error) {
          currentChat.history.push({ role: 'model', parts: [{ text: `Erreur : ${data.error.message}` }] });
        } else {
          currentChat.history.push({ role: 'model', parts: [{ text: "Erreur lors de la réponse de l'IA." }] });
        }
      } catch (error) {
        console.error(error);
        currentChat.history.push({ role: 'model', parts: [{ text: "Erreur de connexion à l'API." }] });
      }

      saveToStorage();
      renderMessages();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    init();
  </script>
</body>
</html>
